[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ld9900"
version = "0.2.0"
description = "Custom firmware, faces and streaming for Bematech / Logic Controls LD9900 USB VFD line displays"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Williams" }]
keywords = ["vfd", "pole display", "line display", "bematech", "logic controls", "ld9900", "hcs08", "firmware"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Environment :: Web Environment",
]
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
preview = ["Pillow>=9"]
test = ["pytest>=7", "Pillow>=9"]

[project.scripts]
ld9900 = "ld9900.cli:main"

[project.urls]
Homepage = "https://github.com/stevendog98/ld9900"
Issues = "https://github.com/stevendog98/ld9900/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
